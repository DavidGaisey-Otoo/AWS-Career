AWSTemplateFormatVersion: "2010-09-09"
Description: "TEST stack - windows-server-administration-secure-managed-server - 9 services - Generated by AWS Career Launchpad Pro"
Parameters:
  ProjectName:
    Type: String
    Default: windows-server-administration-secure-managed-server
  MonthlyBudget:
    Type: Number
    Default: 30
    MinValue: 1
    Description: "Approved monthly AWS budget threshold in USD. A budget alerts; it does not cap charges."
  LabLeaseHours:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 24
    Description: "Hours between automatic EC2 stop attempts. Stopping does not eliminate storage or other AWS charges."
Resources:
  Vpc:
    Type: "AWS::EC2::VPC"
    Properties:
      CidrBlock: "10.0.0.0/16"
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value:
            Fn::Sub: "${ProjectName}-vpc"
  PublicSubnet1:
    Type: "AWS::EC2::Subnet"
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: "10.0.1.0/24"
      MapPublicIpOnLaunch: true
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: ""
  PublicSubnet2:
    Type: "AWS::EC2::Subnet"
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: "10.0.2.0/24"
      MapPublicIpOnLaunch: true
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: ""
  PrivateSubnet1:
    Type: "AWS::EC2::Subnet"
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: "10.0.3.0/24"
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: ""
  PrivateSubnet2:
    Type: "AWS::EC2::Subnet"
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: "10.0.4.0/24"
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: ""
  Igw:
    Type: "AWS::EC2::InternetGateway"
  IgwAttach:
    Type: "AWS::EC2::VPCGatewayAttachment"
    Properties:
      VpcId:
        Ref: Vpc
      InternetGatewayId:
        Ref: Igw
  PublicRouteTable:
    Type: "AWS::EC2::RouteTable"
    Properties:
      VpcId:
        Ref: Vpc
      Tags:
        - Key: Name
          Value:
            Fn::Sub: "${ProjectName}-public-rt"
  PublicDefaultRoute:
    Type: "AWS::EC2::Route"
    DependsOn: IgwAttach
    Properties:
      RouteTableId:
        Ref: PublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId:
        Ref: Igw
  PublicSubnet1RouteAssociation:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
      SubnetId:
        Ref: PublicSubnet1
      RouteTableId:
        Ref: PublicRouteTable
  PublicSubnet2RouteAssociation:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
      SubnetId:
        Ref: PublicSubnet2
      RouteTableId:
        Ref: PublicRouteTable
  AppSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "Managed Windows host - no inbound administration ports; use Systems Manager"
      VpcId:
        Ref: Vpc
      SecurityGroupIngress: []
      Tags:
        - Key: Name
          Value:
            Fn::Sub: "${ProjectName}-app-sg"
  ManagedInstanceRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Tags:
        - Key: Project
          Value:
            Ref: ProjectName
  ManagedInstanceProfile:
    Type: "AWS::IAM::InstanceProfile"
    Properties:
      Roles:
        - Ref: ManagedInstanceRole
  AppInstance:
    Type: "AWS::EC2::Instance"
    Properties:
      InstanceType: t3.micro
      ImageId: "{{resolve:ssm:/aws/service/ami-windows-latest/Windows_Server-2022-English-Full-Base}}"
      SubnetId:
        Ref: PublicSubnet1
      SecurityGroupIds:
        - Ref: AppSecurityGroup
      IamInstanceProfile:
        Ref: ManagedInstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: "/dev/sda1"
          Ebs:
            Encrypted: true
            VolumeType: gp3
            VolumeSize: 30
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value:
            Fn::Sub: "${ProjectName}-app"
        - Key: Project
          Value:
            Ref: ProjectName
  InventoryAssociation:
    Type: "AWS::SSM::Association"
    Properties:
      Name: AWS-GatherSoftwareInventory
      AssociationName:
        Fn::Sub: "${ProjectName}-inventory"
      ScheduleExpression: "rate(1 day)"
      Targets:
        - Key: "tag:Project"
          Values:
            - Ref: ProjectName
  PatchAssociation:
    Type: "AWS::SSM::Association"
    Properties:
      Name: AWS-RunPatchBaseline
      AssociationName:
        Fn::Sub: "${ProjectName}-patch-scan"
      ScheduleExpression: "cron(0 3 ? * SUN *)"
      Parameters:
        Operation:
          - Scan
        RebootOption:
          - NoReboot
      Targets:
        - Key: "tag:Project"
          Values:
            - Ref: ProjectName
  BackupVault:
    Type: "AWS::Backup::BackupVault"
    DeletionPolicy: Delete
    Properties:
      BackupVaultName:
        Fn::Sub: "${ProjectName}-vault"
  BackupServiceRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: backup.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup"
  BackupPlan:
    Type: "AWS::Backup::BackupPlan"
    Properties:
      BackupPlan:
        BackupPlanName:
          Fn::Sub: "${ProjectName}-daily"
        BackupPlanRule:
          - RuleName: DailyBackup
            TargetBackupVault:
              Ref: BackupVault
            ScheduleExpression: "cron(0 5 ? * * *)"
            StartWindowMinutes: 60
            CompletionWindowMinutes: 180
            Lifecycle:
              DeleteAfterDays: 7
  BackupSelection:
    Type: "AWS::Backup::BackupSelection"
    Properties:
      BackupPlanId:
        Ref: BackupPlan
      BackupSelection:
        SelectionName:
          Fn::Sub: "${ProjectName}-tagged-resources"
        IamRoleArn:
          Fn::GetAtt:
            - BackupServiceRole
            - Arn
        ListOfTags:
          - ConditionType: STRINGEQUALS
            ConditionKey: Project
            ConditionValue:
              Ref: ProjectName
  CostBudget:
    Type: "AWS::Budgets::Budget"
    Properties:
      Budget:
        BudgetName:
          Fn::Sub: "${ProjectName}-monthly-cost"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount:
            Ref: MonthlyBudget
          Unit: USD
  InstanceStatusAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmName:
        Fn::Sub: "${ProjectName}-instance-status"
      AlarmDescription: "Detects failed EC2 instance status checks."
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_Instance
      Statistic: Maximum
      Dimensions:
        - Name: InstanceId
          Value:
            Ref: AppInstance
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
  HighCpuAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmName:
        Fn::Sub: "${ProjectName}-high-cpu"
      AlarmDescription: "Detects sustained high CPU on the managed instance."
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Statistic: Average
      Dimensions:
        - Name: InstanceId
          Value:
            Ref: AppInstance
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
  LabStopSchedulerRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: StopOnlyThisLabInstance
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "ec2:StopInstances"
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${AppInstance}"
  AutomaticLabStopSchedule:
    Type: "AWS::Scheduler::Schedule"
    Properties:
      Description: "Training safety lease: repeatedly stops the lab EC2 instance after the selected interval."
      FlexibleTimeWindow:
        Mode: "OFF"
      ScheduleExpression:
        Fn::Sub: "rate(${LabLeaseHours} hours)"
      State: ENABLED
      Target:
        Arn: "arn:aws:scheduler:::aws-sdk:ec2:stopInstances"
        RoleArn:
          Fn::GetAtt:
            - LabStopSchedulerRole
            - Arn
        Input:
          Fn::Sub: "{\"InstanceIds\":[\"${AppInstance}\"]}"
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 2