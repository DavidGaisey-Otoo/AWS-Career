<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0E1A" />
    <!-- CSP: GH Pages can't set headers, so it lives in a meta tag.
         connect-src allows all https because the app talks to user-chosen
         endpoints (any AWS region, custom CORS proxy, 6 gig APIs).
         ws://localhost is for Vite dev HMR only — harmless in prod. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: blob: ws://localhost:* ws://127.0.0.1:*; frame-src https://embed.diagrams.net; object-src 'none'; base-uri 'self'" />
    <meta name="description" content="AWS Career Launchpad Pro — the most ambitious AWS learning and freelance career platform." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AWS Launchpad" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <title>AWS Career Launchpad Pro</title>
  </head>
  <body class="bg-ink-950 text-white antialiased">
    <div id="root">
      <!-- Inline fallback shown if the JS bundle takes >5s OR if it
           throws before React mounts. Gives the user something to look
           at (and copy/paste to me) instead of a blank screen. -->
      <div id="bootstrap-fallback" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;color:#fff;background:#0A0E1A;padding:24px;text-align:center;">
        <div style="max-width:520px;">
          <div style="font-size:32px;margin-bottom:12px;">⚡</div>
          <div id="bootstrap-status" style="font-size:18px;font-weight:700;margin-bottom:8px;">Loading AWS Launchpad...</div>
          <div id="bootstrap-detail" style="font-size:13px;opacity:0.7;">If this message persists for more than 10 seconds, the JS bundle may be blocked. See diagnostics below.</div>
          <div id="bootstrap-error" style="margin-top:16px;font-family:monospace;font-size:12px;color:#FF6B6B;background:#1a1a2e;padding:12px;border-radius:8px;text-align:left;white-space:pre-wrap;word-break:break-word;display:none;"></div>
        </div>
      </div>
    </div>
    <script>
      // Pre-React diagnostics. If the JS bundle fails to load OR throws
      // during init, this catches it and writes the error to a visible
      // div instead of leaving a blank page.
      (function() {
        var fb = document.getElementById('bootstrap-fallback');
        var status = document.getElementById('bootstrap-status');
        var detail = document.getElementById('bootstrap-detail');
        var errEl = document.getElementById('bootstrap-error');
        window.__showBootError = function(msg) {
          if (!errEl) return;
          status.textContent = 'App failed to start';
          detail.textContent = 'Send this error to the developer:';
          errEl.style.display = 'block';
          errEl.textContent = (errEl.textContent ? errEl.textContent + '\n\n' : '') + String(msg);
        };
        window.addEventListener('error', function(e) {
          window.__showBootError('JS Error: ' + (e.message || e.error || 'unknown') + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''));
        });
        window.addEventListener('unhandledrejection', function(e) {
          window.__showBootError('Promise rejection: ' + (e.reason && (e.reason.message || e.reason) || 'unknown'));
        });
        // If the JS bundle never executes (blocked / 404), show diagnostics after 8s
        setTimeout(function() {
          if (document.getElementById('bootstrap-fallback')) {
            window.__showBootError(
              'JavaScript bundle did not execute within 8 seconds.\n\n' +
              'Likely causes:\n' +
              '  - Browser extension (ad blocker / privacy tool) blocking modulepreload\n' +
              '  - Network blocking github.io assets\n' +
              '  - Edge "Tracking prevention" set to Strict\n\n' +
              'Try: open in private/incognito window or different browser.'
            );
          }
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
